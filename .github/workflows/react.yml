name: React CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.1"

      - name: Install dependencies
        run: |
          cd client
          echo "Installing dependencies in $(pwd)"
          npm install

      - name: Run ESLint
        run: |
          cd client
          echo "Running ESLint in $(pwd)"
          npm run lint

      - name: Run Type-Check
        run: |
          cd client
          echo "Running Type-Check in $(pwd)"
          npm run typeCheck

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.1"

      - name: Install dependencies
        run: |
          cd client
          npm install

      - name: Build React app
        run: |
          cd client
          npm run build
          echo "Current working directory:"
          pwd
          echo "Contents of current directory:"
          ls

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 sync client/dist s3://$S3_BUCKET --delete \
            --cache-control "public, max-age=31536000, immutable"

          # index.html, bundle.js and main.css have no hash in their filename, so a browser
          # that already cached them has no way to notice a new deploy on its own - without
          # this they were being cached indefinitely (no header at all = the browser guesses),
          # which is how a phone kept showing a redesign-old stylesheet for days
          for f in index.html bundle.js bundle.js.LICENSE.txt main.css favicon.ico; do
            if [ -f "client/dist/$f" ]; then
              aws s3 cp "client/dist/$f" "s3://$S3_BUCKET/$f" --cache-control "no-cache"
            fi
          done

      - name: Invalidate CloudFront cache
        run: |
          # bundle.js and main.css aren't content-hashed, so without this CloudFront keeps
          # serving whatever it cached pre-deploy until each edge's TTL happens to expire
          aws cloudfront create-invalidation --distribution-id E1LXFFBDIRVSJP --paths "/*"
