name: React CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.1"

      - name: Install dependencies
        run: |
          cd client
          echo "Installing dependencies in $(pwd)"
          npm install

      - name: Run ESLint
        run: |
          cd client
          echo "Running ESLint in $(pwd)"
          npm run lint

      - name: Run Type-Check
        run: |
          cd client
          echo "Running Type-Check in $(pwd)"
          npm run typeCheck

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.1"

      - name: Install dependencies
        run: |
          cd client
          npm install

      - name: Build React app
        run: |
          cd client
          npm run build
          echo "Current working directory:"
          pwd
          echo "Contents of current directory:"
          ls

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          # the JS/CSS filenames carry a content hash now, so a real change always gets a URL
          # nobody's browser has seen before - safe to cache those forever
          aws s3 sync client/dist s3://$S3_BUCKET --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" --exclude "favicon.ico"

          # index.html and favicon.ico keep the same filename across deploys, so they need to
          # be revalidated on every load instead of trusting a stale copy
          aws s3 cp client/dist/index.html "s3://$S3_BUCKET/index.html" --cache-control "no-cache"
          if [ -f client/dist/favicon.ico ]; then
            aws s3 cp client/dist/favicon.ico "s3://$S3_BUCKET/favicon.ico" --cache-control "no-cache"
          fi

      - name: Invalidate CloudFront cache
        run: |
          # index.html/favicon.ico aren't content-hashed, so CloudFront needs telling that a
          # deploy happened rather than waiting for its own cache to expire on its own
          aws cloudfront create-invalidation --distribution-id E1LXFFBDIRVSJP --paths "/*"
